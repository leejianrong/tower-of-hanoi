[project]
name = "tower-of-hanoi"
version = "0.1.0"
description = "Tower of Hanoi game logic, Gymnasium environment, Q-learning agent, and Pygame replay visualizer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.2.3",
    "numpy>=2.4.0",
    "pygame>=2.6.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
