[project]
name = "tower-of-hanoi"
version = "0.1.0"
description = "Tower of Hanoi game logic, Gymnasium environment, Q-learning agent, and a browser replay dashboard built on indah."
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.2.3",
    "indah>=0.9.0",
    "numpy>=2.4.0",
    "starlette>=1.10.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.10",
]
video = [
    "playwright>=1.64.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

# The dashboard uses indah features (Frame, chart kinds, heatmap marks) that are not in a release
# yet. Pinned to the branch until indah ships them; the lockfile holds the exact commit.
[tool.uv.sources]
indah = { git = "https://github.com/leejianrong/indah", branch = "agent/dashboard-pie" }
